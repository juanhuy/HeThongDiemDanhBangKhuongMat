ai:
  model_name: "buffalo_l"
  det_size: [480, 480]
  threshold: 0.65
  # Khoảng thời gian (giây) tái sử dụng kết quả liveness cho cùng một người đã biết,
  # tránh chạy lại mô hình Silent-Face trên CPU mỗi frame -> giảm độ trễ thời gian thực.
  liveness_interval: 2.0

camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30

database:
  db_type: "mysql"
  host: "127.0.0.1"
  port: 3309
  user: "root"
  password: ""
  db_name: "ptit_diem_danh"
  images_dir: "./database/registered_images"
  encryption_key: ""

attendance:
  cooldown_seconds: 30
  # Số phút ân hạn: SV đến trong khoảng này sau giờ bắt đầu vẫn tính "Đúng giờ"
  late_grace_minutes: 5
  # Ngưỡng (phút) không thấy khuôn mặt => coi như SV đã rời lớp (check-out)
  checkout_idle_minutes: 5
  # Bật/tắt tính năng check-in / check-out (đang tạm tắt)
  enable_checkout: false
  log_file: "./logs/attendance_log.csv"
  # Ghi phạm vi không đạt để CẤM THI (tỷ lệ vắng %)
  cam_thi_threshold: 20

registration:
  # Học kỳ & niên khóa đang mở đăng ký (Lớp tín chỉ phải khớp mới được đăng ký)
  semester: 1
  academic_year: "2025-2026"
  # Đợt đăng ký: khóa đăng ký chỉ hoạt động trong khoảng thời gian này
  open_date: "2026-07-01"
  close_date: "2026-12-31"
  # Giới hạn số tín chỉ đăng ký tối thiểu / tối đa mỗi kỳ
  min_credits: 6
  max_credits: 25

# Giá trị mặc định của bảng điều khiển DEMO (Admin bật/tắt trực tiếp trên giao diện
# trong lúc demo; bản lưu trong hệ thống sẽ ghi đè các giá trị này)
demo:
  demo_mode: false
  bypass_registration_window: false
  bypass_semester: false
  bypass_capacity: false
  bypass_prerequisites: false
  bypass_credit_limit: false
  bypass_eligibility: false
  bypass_duplicate_subject: false
  allow_unenroll_after_attendance: false
  allow_after_hours_leave: false
  allow_override_present_leave: false

server:
  host: "0.0.0.0"
  port: 8000

# Cấu hình xác thực JWT (token đăng nhập)
# LƯU Ý: Thay secret_key trước khi đưa lên môi trường thực tế
auth:
  secret_key: ""
  algorithm: "HS256"
  expire_minutes: 480
  token_type: "bearer"

liveness:
  enabled: true
  # Ngưỡng score "người thật" (Silent-Face probs[1])
  ai_threshold: 0.35
  # Ngưỡng khi người dùng quay đầu làm thử thách (KHÔNG hạ quá thấp để tránh bị qua mặt)
  challenge_threshold: 0.30
  # Ngưỡng phương sai Laplacian cho chế độ heuristic (fallback)
  heuristic_min: 80

# LLM local cho Hệ thống Tài liệu (tóm tắt/trích xuất học thuật + flashcard)
# Chạy Ollama:  ~/.local/ollama/bin/ollama serve   rồi   ollama pull qwen2.5:7b
# Nếu model không khả dụng, hệ thống tự động fallback sang thuật toán quy tắc offline.
llm:
  enabled: true
  base_url: "http://127.0.0.1:11434"
  # Model CHÍNH: dùng cho phân tích (tóm tắt/flashcard) + kiểm duyệt.
  # Sau khi train xong: đổi thành "qwen-mine" (model fine-tuned của bạn).
  model: "qwen2.5:7b"
  # Model BASE: dùng làm "lớp an toàn" thứ 2 trong kiểm duyệt (ensemble).
  # Nếu rỗng hoặc giống model chính -> chỉ dùng 1 model.
  model_base: "qwen2.5:7b"
  timeout: 180

# Kiểm duyệt tự động tài liệu
moderation:
  # Mã vi phạm LUÔN TỪ CHỐI tự động
  reject_categories: ["phapluat", "dothi", "doitruy", "spam", "rip", "link_doc_hai", "buon_ban"]
  # Mã vi phạm cần ADMIN xem xét lại
  review_categories: ["daovan", "sai_chu_de", "chat_luong_thap", "sai_lech", "trung_lap"]
  # Ngưỡng tương đồng để gắn cờ trùng lặp (0-1)
  duplicate_threshold: 0.75
